<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #0f111a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="externalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2235" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0050" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">
    System Architecture Diagram
  </text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="400">
    Decoupled Client-Server &amp; Metadata Extraction Pipeline
  </text>

  <!-- CONTAINER 1: CLIENT BROWSER -->
  <rect x="40" y="90" width="250" height="380" rx="16" fill="url(#clientGrad)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)" />
  <rect x="55" y="105" width="220" height="34" rx="8" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
  <text x="165" y="127" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="700">Client Browser (UI Layer)</text>

  <!-- Client Sub-components -->
  <g transform="translate(55, 155)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Single Page App</text>
    <text x="110" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Vanilla JS / HTML5 / CSS3</text>
  </g>

  <g transform="translate(55, 245)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Input Tag Normalizer</text>
    <text x="110" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">URL &amp; Substring Parser</text>
  </g>

  <g transform="translate(55, 335)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Speed Analytics Engine</text>
    <text x="110" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Instant 1.25x-2.0x Calculations</text>
  </g>

  <!-- CONTAINER 2: BACKEND API LAYER -->
  <rect x="325" y="90" width="250" height="380" rx="16" fill="url(#serverGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)" />
  <rect x="340" y="105" width="220" height="34" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
  <text x="450" y="127" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">Backend API Layer (Python)</text>

  <!-- Server Sub-components -->
  <g transform="translate(340, 155)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Flask REST Server</text>
    <text x="110" y="50" text-anchor="middle" fill="#60a5fa" font-size="11">/api/calculate Endpoint</text>
  </g>

  <g transform="translate(340, 245)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">yt-dlp Scraper Engine</text>
    <text x="110" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Flat Playlist Scraper</text>
  </g>

  <g transform="translate(340, 335)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Range &amp; Slice Engine</text>
    <text x="110" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Ordinal Index Range Bounds</text>
  </g>

  <!-- CONTAINER 3: EXTERNAL INFRASTRUCTURE -->
  <rect x="610" y="90" width="250" height="380" rx="16" fill="url(#externalGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)" />
  <rect x="625" y="105" width="220" height="34" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="735" y="127" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">External Infrastructure</text>

  <!-- External Sub-components -->
  <g transform="translate(625, 175)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="35" cy="50" r="18" fill="#ff0000" fill-opacity="0.2" stroke="#ff0000" stroke-width="1" />
    <polygon points="30,42 43,50 30,58" fill="#ff4d4d" />
    <text x="125" y="45" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">YouTube Platform</text>
    <text x="125" y="65" text-anchor="middle" fill="#94a3b8" font-size="11">Playlist Data &amp; CDN</text>
  </g>

  <g transform="translate(625, 305)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="110" y="45" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Render PaaS Cloud</text>
    <text x="110" y="65" text-anchor="middle" fill="#34d399" font-size="11">Gunicorn WSGI (120s Timeout)</text>
  </g>

  <!-- ARROWS / CONNECTORS -->
  <!-- Client to Backend -->
  <path d="M 275 190 L 340 190" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="307" y="180" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="600">POST JSON</text>

  <!-- Backend to YouTube -->
  <path d="M 560 280 L 625 225" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="590" y="240" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Scrape</text>

  <!-- Backend Response to Client -->
  <path d="M 340 370 L 275 370" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="307" y="360" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">Response</text>

</svg>
